<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8041295154848064"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC97org Professional Divisions</title>
    <!-- Tailwind CSS for layout and utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }

        /* Professional Button Base Styles */
        .btn-pro {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        /* Hover Animations */
        .btn-pro:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -5px rgba(0, 0, 0, 0.1);
        }

        .btn-pro:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        /* Specific Button Gradients */
        .btn-academy {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);
        }
        
        .btn-civil {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            box-shadow: 0 4px 14px 0 rgba(5, 150, 105, 0.39);
        }

        .btn-marketing {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            box-shadow: 0 4px 14px 0 rgba(124, 58, 237, 0.39);
        }

        /* SVG Icon Transition */
        .btn-pro svg {
            transition: transform 0.3s ease;
        }
        .btn-pro:hover svg {
            transform: scale(1.15) rotate(-5deg);
        }

        /* Ripple Effect Styles */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 600ms linear;
            background-color: rgba(255, 255, 255, 0.4);
            pointer-events: none; /* Ensure clicks pass through */
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-slate-800">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-gray-100 backdrop-blur-sm bg-white/90">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Click on one</h1>
            <p class="text-sm text-gray-500 mt-2">Choose a department to proceed</p>
        </div>

        <div class="flex flex-col gap-5">
            <!-- Button 1: Academy -->
            <a href="/Academy/academy-website" target="_blank" rel="noopener noreferrer" class="btn-pro btn-academy text-white px-6 py-4 rounded-xl text-lg font-semibold cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 14v6m-3-2.818l-3.222 3.222M15 18.182l3.222 3.222" />
                </svg>
                KC97org KC97 Academy
            </a>

            <!-- Button 2: Civil Services -->
            <a href="/Civil_Services_Website/civil-engineering-website" target="_blank" rel="noopener noreferrer" class="btn-pro btn-civil text-white px-6 py-4 rounded-xl text-lg font-semibold cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <!-- Dome of the hard hat -->
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 14c0-3.31 2.69-6 6-6s6 2.69 6 6" />
                    <!-- Brim -->
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 14h16c1.1 0 2 .9 2 2v0a2 2 0 01-2 2H4a2 2 0 01-2-2v0c0-1.1.9-2 2-2z" />
                    <!-- Ridge on top -->
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 8V6a2 2 0 014 0v2" />
                </svg>
                KC97org KC97 Civil Services
            </a>

            <!-- Button 3: Marketing -->
            <a href="/Marketing_Website/marketing-website" target="_blank" rel="noopener noreferrer" class="btn-pro btn-marketing text-white px-6 py-4 rounded-xl text-lg font-semibold cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
                </svg>
                KC97org KC97 Marketing
            </a>
        </div>
    </main>

    <script>
        // Select all buttons with the 'btn-pro' class
        const buttons = document.querySelectorAll('.btn-pro');

        buttons.forEach(button => {
            button.addEventListener('click', function (e) {
                // Get bounding rectangle to calculate exact position relative to button
                const rect = button.getBoundingClientRect();
                
                // Calculate click coordinates relative to the button
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Create the ripple span element
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                
                // Set the size of the ripple to be large enough to cover the button
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;
                
                ripple.style.width = ripple.style.height = `${diameter}px`;
                ripple.style.left = `${x - radius}px`;
                ripple.style.top = `${y - radius}px`;

                // Append ripple to button
                this.appendChild(ripple);

                // Remove the ripple element after the animation completes (600ms)
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
    </script>
</body>
</html>
