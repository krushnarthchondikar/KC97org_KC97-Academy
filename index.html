    <style>
        body {
            font-family: 'Inter', sans-serif;

        /* 1. Graceful Entrance Animations */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }

        /* 2. Organic Ambient Background Animations */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: floatMorph 12s infinite ease-in-out alternate;
        }
        @keyframes floatMorph {
            0% { transform: translateY(0) scale(1) rotate(0deg); border-radius: 50%; }
            50% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            100% { transform: translateY(-30px) scale(1.1) rotate(10deg); border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
        }

        /* 3. Premium Button Base & Hover */
        .btn-pro {
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-pro:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255,255,255,0.4);
        }
        .btn-pro:active {
            transform: translateY(1px) scale(0.99);
        }

        /* 4. Glass Shine Hover Effect */
        .btn-pro::after {
            content: '';
            position: absolute;
            top: 0; 
            left: -150%;
            width: 50%; 
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: all 0.75s ease;
            pointer-events: none;
        }
        .btn-pro:hover::after {
            left: 200%;
            transition: all 0.75s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Button-Specific Gradients */
        .btn-academy {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 4px 15px -3px rgba(37, 99, 235, 0.3);
        }
        .btn-civil {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            box-shadow: 0 4px 15px -3px rgba(16, 185, 129, 0.3);
        }
        .btn-marketing {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            box-shadow: 0 4px 15px -3px rgba(139, 92, 246, 0.3);
        }

        /* Icon Container Animations */
        .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 12px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-pro:hover .icon-wrapper {
            transform: scale(1.15) rotate(-5deg);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 600ms cubic-bezier(0.4, 0, 0.2, 1);
            background-color: rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
